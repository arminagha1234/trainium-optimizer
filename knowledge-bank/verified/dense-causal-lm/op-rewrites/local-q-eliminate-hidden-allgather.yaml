reason: 'Standard TP all-gathers full hidden states then each rank computes QKV on
  a shard. Local-Q inverts it: each rank computes full QKV on its local tokens (seq/TP),
  then all-gathers only the small K/V. Saves the hidden all_gather and cuts QKV compute
  by TP x.'
