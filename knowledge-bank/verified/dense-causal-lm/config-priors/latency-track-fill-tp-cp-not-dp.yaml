intervention:
  spec:
    track: latency
    dp_degree: 1
    cp_degree: 2
    batching: static
reason: "For the 'fastest possible' (lowest per-request latency) track, fill the instance\
  \ with tensor/context parallelism, NOT data-parallel replicas: DP raises aggregate\
  \ tok/s but does nothing for a single request's latency. So set dp=1 and put more\
  \ cores on the one request \u2014 raise tp (up to the KV-head cap, or beyond via\
  \ KV replication) and cp_degree (splits the sequence, wins most at long context).\
  \ Prefer smaller batch. This is the mirror image of the throughput prior, which\
  \ fills with DP replicas instead."
symptoms_addressed:
- bottleneck: latency_bound
  signature: single-request TTFT/'/token latency is the objective
  observed_via: customer SLA on p50/p99 latency, batch small
last_reverified_sdk: 2.28.0
