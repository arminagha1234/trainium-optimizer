reason: "Hybrid-attention ~27B (Qwen3.x-style GQA, often 4 KV heads) is capped at\
  \ TP=num_kv_heads=4 for clean attention sharding. That is only 4 of 64 logical cores\
  \ on trn2.48xlarge (LNC=2). Do NOT stop there: the search sweeps the whole TPxDP\
  \ grid (TP=4xDP=16, TP=8xDP=8, ... TP=64xDP=1 \u2014 every box-filling partition)\
  \ and MEASURES each; a good default is low-TP x many-DP for throughput, but the\
  \ winner is decided by measurement. TP>kv_heads is possible via KV replication but\
  \ must be measured, not assumed \u2014 it trades redundant KV work for tensor-parallel\
  \ width and only sometimes wins. Leaving 12 cores idle is the failure mode to avoid."
symptoms_addressed:
- bottleneck: under_utilized
  signature: TP group << instance cores; most of the box idle
  observed_via: device_utilization low; MFU low despite fast per-replica
