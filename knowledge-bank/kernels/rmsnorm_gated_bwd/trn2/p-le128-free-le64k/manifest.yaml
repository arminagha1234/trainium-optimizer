provenance: >-
  Backward of Qwen3.5 RMSNormGated (norm-before-gate). Returns dx, dweight[1,F],
  dgate. dweight sums over the partition (token) axis via a ones@(.) matmul; dx
  combines the direct x*r path with the mean-square dms*2x/F path; dgate = ds*silu'.
  Completes the all-NKI-kernel trainable GDN mixer (conv1d fwd+bwd, gdn fwd+bwd,
  RMSNormGated fwd+bwd).
